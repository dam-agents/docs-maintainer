# yaml-language-server: $schema=https://raw.githubusercontent.com/dam-agents/dam-starter-kits/main/kit.schema.json
# The Starter Kit for docs-maintainer. It lives beside the definition it seeds, so a
# change to the agent and a change to the kit offering it are the same commit.
# ONBOARDING.md is the source of truth for every schedule below; the task texts here
# are verbatim copies of its blockquotes (scripts/validate-definition.sh compares them).
schemaVersion: v1
id: docs-maintainer
name: Docs Maintainer
description: >-
  Catches the documentation drift code reviews miss. Runs after merges, alongside
  your usual docs-in-the-PR habit, for any two GitHub repositories (github.com or
  GitHub Enterprise; docs can live in the source repo). A weekday sweep checks each
  merged PR and opens small fixes for verified errors. Tagged-release projects get
  one thorough PR per stable release; main-based projects get one rolling PR,
  updated as commits land. Nothing reaches the site unverified against the release.
  A weekly self-audit checks its health. Optional Slack or Telegram reports send
  only when there's something to report.
tagline: Catches the docs drift code reviews miss.
category: software
icon: book
harnesses: [claude-code, codex, bob]
docsUrl: https://github.com/dam-agents/docs-maintainer
# `self` is this repository at the commit the kit was resolved at; `home`, because
# the checkout is /home/agent itself. The allowlist .gitignore makes that safe, and
# runtime state lives beside it in work/, outside the repo.
seed:
  self: true
  into: home
# No `onboarding` block on purpose: the platform composes the briefing and ends it
# with "follow ONBOARDING.md", which keeps the onboarding gate, the checklist tools
# and the hold on the schedules below.
connections:
  - accepts: [github, github-enterprise]
    required: true
    note: >-
      Reads the source repository and opens pull requests on the docs
      repository. Grant one connection per host when the two repositories live
      on different hosts. Use a bot or machine account where you can: the pull
      requests are opened as whoever this connection signs in as.
  - accepts: [slack, telegram]
    required: false
    note: >-
      Only for reports. The agent posts a short note when it queued something,
      opened a pull request, or found a published error, and stays silent on a
      quiet day. Skip it to keep everything in chat.
channels:
  - type: slack
    note: >-
      The channel reports go to, once you turn reporting on during onboarding.
      The owner can also ask for a pass or a status update there.
schedules:
  - name: docs-maintainer-sweep-weekday
    cron: "0 6 * * 1-5"
    description: Triages new source commits into the queue and fixes verified errors on the published site.
    sessionMode: fresh
    precheck: bash "$HOME/scripts/precheck.sh" sweep
    task: >-
      Docs sweep. The precheck already ran the pre-flight and found work: read the
      worklist JSON at the path its output names, and never run preflight.sh again
      this run. If the prompt carries no worklist path, run `bash
      "$HOME/scripts/preflight.sh" sweep` yourself. Then follow CLAUDE.md → "Sweep
      run": read exactly the worklist's read_set, run release_due per CLAUDE.md →
      "Release run" when present (main: the one-time baseline), triage every
      untriaged source commit, fix each verified correction in fixes_due as its own small pull
      request, write update_due per docs/update.md when present, report per
      docs/reporting.md, and back up work/ at the
      end with `bash "$HOME/scripts/work-backup.sh" persist` when $GITHUB_REPO_WORK
      is set.
  - name: docs-maintainer-release-hourly
    cron: "23 * * * *"
    description: Wakes only when a new stable release exists, then runs the release pass as one pull request.
    sessionMode: fresh
    precheck: bash "$HOME/scripts/precheck.sh" release
    task: >-
      Release pass. The precheck already ran the pre-flight and found a release to
      document: read the worklist JSON at the path its output names, and never run
      preflight.sh again this run. If the prompt carries no worklist path, run `bash
      "$HOME/scripts/preflight.sh" release` yourself. Then follow CLAUDE.md →
      "Release run": read exactly the worklist's read_set, run the pass per
      docs/release-pass.md as one pull request covering the release and the whole
      open queue, report per docs/reporting.md, and back up work/ at the end with
      `bash "$HOME/scripts/work-backup.sh" persist` when $GITHUB_REPO_WORK is set.
  - name: docs-maintainer-audit-weekly
    cron: "0 7 * * 5"
    description: Checks the agent's own health, queue and open pull requests, and reports traffic-light.
    sessionMode: fresh
    task: >-
      Weekly audit. Run `bash "$HOME/scripts/preflight.sh" audit` first — this run
      is ungated. Then follow CLAUDE.md → "Audit run": read docs/audit.md, verify
      the schedules, report traffic-light per docs/reporting.md, append the
      AUDIT.log line, and back up work/ at the end with `bash
      "$HOME/scripts/work-backup.sh" persist` when $GITHUB_REPO_WORK is set.
